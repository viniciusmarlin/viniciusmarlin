name: Generate stats card

on:
  schedule:
    # executa a cada 12 horas
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: generate stats.svg
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&hide_title=false&hide_rank=false&show_icons=true&include_all_commits=true&count_private=true&disable_animations=false&theme=dracula&locale=en&hide_border=false
          path: dist/stats.svg
          # Se você criou o PAT no Passo 2, use secrets.PAT_TOKEN. Se não precisa de dados privados, mude para false a opcao acima e use secrets.GITHUB_TOKEN
          token: ${{ secrets.PAT_TOKEN }}

      - name: push stats.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: stats-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
